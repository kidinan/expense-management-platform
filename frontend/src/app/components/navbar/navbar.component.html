<nav class="navbar">
  <div class="nav-container">
    <div class="nav-brand">
      <a routerLink="/dashboard" class="brand-logo">
        <div class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
            <line x1="2" y1="10" x2="22" y2="10"></line>
          </svg>
        </div>
        <span class="logo-text">Expense<span class="logo-muted">Tracker</span></span>
      </a>

      <div class="nav-links" *ngIf="authService.isLoggedIn()">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="9"></rect>
            <rect x="14" y="3" width="7" height="5"></rect>
            <rect x="14" y="12" width="7" height="9"></rect>
            <rect x="3" y="16" width="7" height="5"></rect>
          </svg>
          <span>Dashboard</span>
        </a>
        <a routerLink="/expenses" routerLinkActive="active" class="nav-link">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"></line>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
          <span>Expenses</span>
        </a>
      </div>
    </div>

    <div class="nav-actions" *ngIf="authService.isLoggedIn()">
      <div class="user-menu-wrapper">
        <button class="user-trigger-btn" (click)="toggleUserMenu()">
          <div class="avatar-circle">
            {{ authService.currentUser()?.fullName?.charAt(0) || 'U' }}
          </div>
          <div class="user-info-text">
            <span class="user-name">{{ authService.currentUser()?.fullName }}</span>
          </div>
          <svg class="chevron-icon" [class.rotated]="showUserMenu" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <div class="dropdown-popover" *ngIf="showUserMenu" (mouseleave)="closeUserMenu()">
          <div class="popover-profile">
            <p class="profile-name">{{ authService.currentUser()?.fullName }}</p>
            <p class="profile-email">{{ authService.currentUser()?.email }}</p>
          </div>
          <div class="popover-divider"></div>
          <button class="popover-item" (click)="openPasswordModal()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>Change Password</span>
          </button>
          <div class="popover-divider"></div>
          <button class="popover-item text-danger" (click)="logout()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Sign out</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>

<app-change-password-modal
  *ngIf="showPasswordModal"
  (closed)="showPasswordModal = false">
</app-change-password-modal>
