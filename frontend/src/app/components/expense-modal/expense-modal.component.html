<div class="modal-backdrop" (click)="close()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div>
        <h3 class="modal-title">{{ expenseToEdit ? 'Edit Expense' : 'Add Expense' }}</h3>
        <p class="modal-desc">{{ expenseToEdit ? 'Update details for this record' : 'Create a new expense transaction' }}</p>
      </div>
      <button class="close-icon-btn" (click)="close()" title="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <form (ngSubmit)="onSubmit()" class="modal-body">
      <div *ngIf="errorMessage" class="alert-banner alert-error">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <div class="form-group">
        <label class="form-label">Amount</label>
        <div class="amount-field-wrap">
          <span class="currency-prefix">$</span>
          <input
            type="number"
            step="0.01"
            min="0.01"
            class="form-input amount-input tabular-nums"
            [(ngModel)]="amount"
            name="amount"
            placeholder="0.00"
            required
            autofocus
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <input
          type="text"
          class="form-input"
          [(ngModel)]="description"
          name="description"
          placeholder="e.g. Office supplies or Coffee"
          required
        />
      </div>

      <div class="form-row">
        <div class="form-group col">
          <label class="form-label">Category</label>
          <select class="form-input" [(ngModel)]="category" name="category" required>
            <option *ngFor="let cat of categories" [value]="cat.name">
              {{ cat.name }}
            </option>
          </select>
        </div>

        <div class="form-group col">
          <label class="form-label">Date</label>
          <input
            type="date"
            class="form-input"
            [(ngModel)]="date"
            name="date"
            required
          />
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" (click)="close()">Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Saving...' : (expenseToEdit ? 'Save Changes' : 'Create Expense') }}
        </button>
      </div>
    </form>
  </div>
</div>
