<div class="modal-backdrop" (click)="close()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title">{{ expenseToEdit ? 'Edit Expense' : 'Add New Expense' }}</h3>
      <button class="close-btn" (click)="close()">&times;</button>
    </div>

    <form (ngSubmit)="onSubmit()" class="modal-body">
      <div *ngIf="errorMessage" class="alert-banner alert-error">
        {{ errorMessage }}
      </div>

      <div class="form-group">
        <label class="form-label">Amount ($)</label>
        <div class="input-prefix-wrapper">
          <span class="currency-symbol">$</span>
          <input
            type="number"
            step="0.01"
            min="0.01"
            class="form-input with-prefix"
            [(ngModel)]="amount"
            name="amount"
            placeholder="0.00"
            required
            autofocus
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <input
          type="text"
          class="form-input"
          [(ngModel)]="description"
          name="description"
          placeholder="e.g. Weekly grocery run"
          required
        />
      </div>

      <div class="form-row">
        <div class="form-group col">
          <label class="form-label">Category</label>
          <select class="form-input" [(ngModel)]="category" name="category" required>
            <option *ngFor="let cat of categories" [value]="cat.name">
              {{ cat.icon }} {{ cat.name }}
            </option>
          </select>
        </div>

        <div class="form-group col">
          <label class="form-label">Date</label>
          <input
            type="date"
            class="form-input"
            [(ngModel)]="date"
            name="date"
            required
          />
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="close()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Saving...' : (expenseToEdit ? 'Update Expense' : 'Save Expense') }}
        </button>
      </div>
    </form>
  </div>
</div>
