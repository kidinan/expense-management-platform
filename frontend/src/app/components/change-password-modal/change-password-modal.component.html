<div class="modal-backdrop" (click)="close()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div>
        <h3 class="modal-title">Security & Password</h3>
        <p class="modal-desc">Update the password for your account</p>
      </div>
      <button class="close-icon-btn" (click)="close()" title="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <form (ngSubmit)="onSubmit()" class="modal-body">
      <div *ngIf="errorMessage" class="alert-banner alert-error">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <div *ngIf="successMessage" class="alert-banner alert-success">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span>{{ successMessage }}</span>
      </div>

      <div class="form-group">
        <label class="form-label">Current Password</label>
        <input
          type="password"
          class="form-input"
          [(ngModel)]="currentPassword"
          name="currentPassword"
          placeholder="Enter current password"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label">New Password</label>
        <input
          type="password"
          class="form-input"
          [(ngModel)]="newPassword"
          name="newPassword"
          placeholder="Minimum 6 characters"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input
          type="password"
          class="form-input"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Re-enter new password"
          required
        />
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" (click)="close()">Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Updating...' : 'Change Password' }}
        </button>
      </div>
    </form>
  </div>
</div>
