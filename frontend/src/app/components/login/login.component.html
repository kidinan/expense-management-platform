<div class="auth-wrapper">
  <div class="auth-card card">
    <div class="auth-header">
      <div class="brand-emblem">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="2"></rect>
          <line x1="2" y1="10" x2="22" y2="10"></line>
        </svg>
      </div>
      <h1 class="auth-title">Sign in</h1>
      <p class="auth-subtitle">Access your personal expense dashboard</p>
    </div>

    <div *ngIf="errorMessage" class="alert-banner alert-error">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input
          type="text"
          class="form-input"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter your username"
          required
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input
          type="password"
          class="form-input"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          required
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading">
        {{ isLoading ? 'Authenticating...' : 'Sign in to account' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>New to ExpenseTracker? <a routerLink="/register" class="auth-link">Create an account</a></p>
    </div>
  </div>
</div>
