services:
  postgres:
    image: postgres:16
    container_name: expense_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: expensedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expensedb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
